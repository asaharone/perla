<title>Perla Helsa E-com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: липка шапка (назва · місяць · розділи ТЗ) → одна робоча поверхня до 1240px; картки за блоком; на телефоні — одна колонка. Токени спільні з Cockpit. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eef2f0; --ink:#121715; --ink-2:#46504c; --muted:#6f7975;
  --line:#dde3e0; --line-2:#c5cdc9;
  --accent:#0d6b5e; --accent-ink:#ffffff; --accent-wash:rgba(13,107,94,.09);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7; --ly:#9ea6a2; --ref:#46504c;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#006300; --warn-ink:#7a5000; --crit-ink:#b42323;
  --good-wash:rgba(12,163,12,.10); --warn-wash:rgba(250,178,25,.18); --crit-wash:rgba(208,59,59,.11);
  --band:rgba(18,23,21,.05); --shadow:0 8px 24px rgba(0,0,0,.14);
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1110; --surface:#151a19; --surface-2:#1c2321; --ink:#edf2ef; --ink-2:#bfc8c3; --muted:#8b9590;
    --line:#27302d; --line-2:#3a4440;
    --accent:#53c4ae; --accent-ink:#0d1110; --accent-wash:rgba(83,196,174,.13);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --ly:#6a7470; --ref:#bfc8c3;
    --good-ink:#4fd34f; --warn-ink:#ffc94d; --crit-ink:#ff8080;
    --good-wash:rgba(12,163,12,.16); --warn-wash:rgba(250,178,25,.16); --crit-wash:rgba(208,59,59,.20);
    --band:rgba(237,242,239,.06); --shadow:0 8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1110; --surface:#151a19; --surface-2:#1c2321; --ink:#edf2ef; --ink-2:#bfc8c3; --muted:#8b9590;
  --line:#27302d; --line-2:#3a4440;
  --accent:#53c4ae; --accent-ink:#0d1110; --accent-wash:rgba(83,196,174,.13);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --ly:#6a7470; --ref:#bfc8c3;
  --good-ink:#4fd34f; --warn-ink:#ffc94d; --crit-ink:#ff8080;
  --good-wash:rgba(12,163,12,.16); --warn-wash:rgba(250,178,25,.16); --crit-wash:rgba(208,59,59,.20);
  --band:rgba(237,242,239,.06); --shadow:0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 56px}
@media (max-width:520px){.wrap{padding-inline:16px}}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-block:14px 10px}
.top .row{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:clamp(18px,2.4vw,24px);line-height:1.15;letter-spacing:-.01em}
.brand .meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.brand .meta b{font-weight:600;color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
select,input[type=text],input[type=number],input[type=date],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
select{padding-right:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:72px;resize:vertical;line-height:1.45}
input:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-2)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:inherit;font-size:14px;font-weight:500;color:var(--ink-2);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tab:hover{background:var(--surface)}
.tab .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .k{color:var(--bg);opacity:.7}
.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:default}

/* views */
.view{margin-top:22px}
.vhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.vhead h2{font-family:var(--font-display);font-weight:500;font-size:18px;letter-spacing:-.005em}
.vhead p{color:var(--muted);font-size:13.5px;max-width:78ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h3{font-size:14.5px;font-weight:600}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.grid{display:grid;gap:12px;margin-top:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g57{grid-template-columns:minmax(0,5fr) minmax(0,7fr)} .g75{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:880px){.g2,.g57,.g75,.g3{grid-template-columns:1fr}}
@media (max-width:460px){.g4{grid-template-columns:1fr}}
section[hidden]{display:none}

/* status chip: icon + label, never color alone */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px 3px 7px;white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff;line-height:1;flex:none}
.chip.ok{background:var(--good-wash);color:var(--good-ink)} .chip.ok i{background:var(--good)}
.chip.watch{background:var(--warn-wash);color:var(--warn-ink)} .chip.watch i{background:var(--warn);color:#3a2800}
.chip.alert{background:var(--crit-wash);color:var(--crit-ink)} .chip.alert i{background:var(--crit)}
.chip.na{background:var(--surface-2);color:var(--ink-2)} .chip.na i{background:var(--line-2);color:var(--ink)}

/* verdict + tiles */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;border-left:4px solid var(--crit)}
.verdict.ok{border-left-color:var(--good)} .verdict.watch{border-left-color:var(--warn)}
.verdict .vt{font-size:17px;font-weight:600;line-height:1.35}
.verdict .vd{grid-column:2;color:var(--ink-2);font-size:13.5px}
@media (max-width:620px){.verdict{grid-template-columns:1fr}.verdict .vd{grid-column:1}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:6px}
.tile .lbl{font-size:13px;color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tile .val{font-size:27px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.tile .val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.tile .hint{font-size:12.5px;color:var(--muted)}
.deltas{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;margin-top:2px}
.deltas span{white-space:nowrap;color:var(--muted)}
.deltas b{font-weight:600}
.up-good,.down-good{color:var(--good-ink)} .up-bad,.down-bad{color:var(--crit-ink)} .neutral{color:var(--ink-2)}
.spark{display:block;width:100%;height:34px;margin-top:auto}

/* lists */
.facts{margin:10px 0 0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.facts li::marker{color:var(--muted)}
.flags{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.flags li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.flags li .who{font-size:12px;color:var(--muted);white-space:nowrap}
.flags li .who a{color:var(--accent);text-decoration:none}
@media (max-width:520px){.flags li{grid-template-columns:auto 1fr}.flags li .who{grid-column:2}}
.chan{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px 12px;align-items:center;margin-top:12px;font-size:13.5px}
.chan .nm{display:flex;align-items:center;gap:8px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.bar{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:5px}
.chan .v{text-align:right;white-space:nowrap}
.chan .v small{color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:minmax(140px,max-content) 1fr;gap:6px 14px;margin:10px 0 0;font-size:13.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:500}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:4px}}

/* charts */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lk{width:16px;height:0;border-top:2px solid currentColor;display:inline-block}
.lk.dash{border-top-style:dashed}
.lk.box{width:12px;height:12px;border:none;border-radius:3px}
.plot{position:relative;margin-top:6px}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot text{font-family:var(--font-body)}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:12.5px;box-shadow:var(--shadow);min-width:170px;max-width:280px}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;line-height:1.7}
.tip .r b{font-weight:600;font-variant-numeric:tabular-nums}
.tip .r i{display:block;height:0;border-top:2px solid}
.tip .r i.dash{border-top-style:dashed}
.tip .r i.box{height:10px;border:none;border-radius:2px}
.tip .r em{font-style:normal;color:var(--ink-2)}

/* tables */
.tablebar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:12px 0 10px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:12px;z-index:1}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;min-width:200px;white-space:normal}
thead th:first-child{background:var(--surface-2);z-index:3}
td{font-variant-numeric:tabular-nums}
tr.sec td{background:var(--surface-2);font-weight:600;color:var(--ink);text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
tr.sec td:first-child{background:var(--surface-2)}
tr.ind td:first-child{padding-left:26px;color:var(--ink-2)}
tr.ref td{color:var(--muted)}
td.fut,th.fut{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--band) 6px 7px)}
th.ytd,td.ytd{border-left:1px solid var(--line-2);font-weight:600}
td.bad{background:var(--crit-wash)} td.watch{background:var(--warn-wash)} td.okc{background:var(--good-wash)}
th.sel,td.sel{box-shadow:inset 1px 0 0 var(--accent),inset -1px 0 0 var(--accent)}
tbody tr:hover td{background-image:linear-gradient(var(--band),var(--band))}
tbody tr:last-child td{border-bottom:none}
td.txt{white-space:normal;text-align:left;min-width:220px}
.legend-t{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend-t span{display:inline-flex;gap:6px;align-items:center}
.legend-t .sq{width:12px;height:12px;border-radius:3px;display:inline-block}

/* benchmarks */
.bench{display:grid;gap:10px;margin-top:12px}
.bench .brow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.6fr) minmax(0,1.6fr) auto;gap:10px 16px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.bench .brow.head{background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-block:8px}
.bench .m{font-weight:600;font-size:14px}
.bench .m small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.bench .pv{font-size:20px;font-weight:600}
.bench .pv small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.bench .mk{font-size:13px;color:var(--ink-2)}
.bench .mk b{color:var(--ink)}
.bench .src{font-size:12px;color:var(--muted);margin-top:4px}
.bench .src a{color:var(--accent);text-decoration:none}
.bench .pos svg{display:block;width:100%;height:auto}
@media (max-width:980px){.bench .brow{grid-template-columns:1fr 1fr}.bench .brow.head{display:none}.bench .brow>*:first-child{grid-column:1/-1}}

/* flow */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:step;padding:0;margin:12px 0 0;list-style:none}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.flow{grid-template-columns:1fr}}
.flow li{counter-increment:step;display:flex;flex-direction:column;gap:6px}
.flow .when{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.flow .when::before{content:counter(step) " · ";color:var(--muted)}
.flow h3{font-size:15px}
.flow p{font-size:13.5px;color:var(--ink-2)}
.flow .who{font-size:12px;color:var(--muted);margin-top:auto}
dl.defs{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 14px;margin:12px 0 0;font-size:13.5px}
dl.defs dt{font-weight:600} dl.defs dd{margin:0;color:var(--ink-2)}
@media (max-width:520px){dl.defs{grid-template-columns:1fr}dl.defs dd{margin-bottom:6px}}
ul.issues{margin:12px 0 0;padding-left:18px;display:grid;gap:8px;font-size:13.5px;color:var(--ink-2)}
ul.issues b{color:var(--ink);font-weight:600}
details{margin-top:12px}
summary{cursor:pointer;font-weight:500;font-size:14px}
pre{margin:10px 0 0;padding:12px;background:var(--surface-2);border-radius:8px;font-size:11.5px;line-height:1.5;overflow-x:auto;color:var(--ink-2);max-height:420px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* forms (db) */
.form{display:grid;gap:10px;margin-top:12px}
.form .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form .fld{display:flex;flex-direction:column;gap:4px}
.form .fld label{font-size:12px;color:var(--muted);font-weight:500}
.form .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.form .status{font-size:12.5px;color:var(--muted)}
.dbnote{font-size:12.5px;color:var(--muted);margin-top:6px}
.decisions{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.decisions li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.decisions li.done{opacity:.6}
.decisions li .meta{font-size:12px;color:var(--muted);display:block}
.decisions li button{font-size:12px;padding:4px 9px}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:4px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}

/* e-com additions */
.funnel{display:grid;gap:6px;margin-top:12px}
.funnel .fr{display:grid;grid-template-columns:minmax(120px,160px) minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13px}
.funnel .fr .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.funnel .fr .bar{height:14px}
.funnel .fr .v{text-align:right;white-space:nowrap;font-weight:600;min-width:64px}
.funnel .fr .cv{text-align:right;white-space:nowrap;color:var(--muted);min-width:70px;font-size:12px}
@media (max-width:520px){.funnel .fr{grid-template-columns:minmax(90px,120px) minmax(0,1fr) auto}.funnel .fr .cv{display:none}}
.heat{display:grid;gap:4px;margin-top:12px;font-size:12.5px}
.heat .hr{display:grid;grid-template-columns:minmax(150px,220px) repeat(var(--n),minmax(0,1fr));gap:4px;align-items:stretch}
.heat .hr>span{padding:6px 8px;border-radius:6px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.heat .hr>span:first-child{text-align:left;background:transparent;color:var(--ink-2)}
.heat .hr.hd>span{background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;text-align:right}
.heat .hr.hd>span:first-child{text-align:left}
.hs{display:block;background:var(--surface-2)}
.deflist{display:grid;gap:10px;margin-top:12px}
.deflist .d{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:6px 16px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.deflist .d b{font-weight:600}
.deflist .d .src{grid-column:2;font-size:12px;color:var(--muted)}
@media (max-width:620px){.deflist .d{grid-template-columns:1fr}.deflist .d .src{grid-column:1}}
.steps{margin:10px 0 0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.steps li::marker{color:var(--accent);font-weight:600}
.pri{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:2px 6px;background:var(--accent-wash);color:var(--accent);margin-right:6px;vertical-align:middle}
.pri.p2{background:var(--warn-wash);color:var(--warn-ink)} .pri.p3{background:var(--surface-2);color:var(--ink-2)}
